name: Bug
description: Something is broken or behaves wrongly.
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [backend, ios, database, ci]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: App build, iOS version, simulator or device, or API environment. Optional.
    validations:
      required: false
