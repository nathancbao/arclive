name: Feature
description: New behavior users will see.
labels: ["type: feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What to build
      description: What should the app or API do, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist. The issue is done when every box is true.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [backend, ios, database, ci]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Designs, links, open questions. Optional.
    validations:
      required: false
