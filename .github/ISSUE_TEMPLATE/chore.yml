name: Chore
description: Maintenance, refactoring, tooling or docs with no user-facing change.
labels: ["type: chore"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What needs doing, and why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [backend, ios, database, ci]
    validations:
      required: true
