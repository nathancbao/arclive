name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Squash merges use the PR title as the commit message on main, so the title must follow Conventional Commits.
      - name: Check the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|ci|docs|feat|fix|perf|refactor|test|chore|revert)(\([a-z0-9-]+\))?: [a-z].{0,70}[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title \"$TITLE\" must look like: feat(backend): add stats endpoint"
            echo "Types: build, ci, docs, feat, fix, perf, refactor, test, chore, revert. Scope is optional."
            echo "Summary is imperative, starts lowercase and has no trailing period."
            exit 1
          fi

  backend:
    name: Backend (lint and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  ios:
    name: iOS (build)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Xcode project is generated from ios/project.yml and is not committed.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project ArcLive.xcodeproj \
            -scheme ArcLive \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
